cache_timeout: 600

# Necessary packages
_gnocchi_package_names_condition: >-
  {{
    (
      (ansible_facts['distribution'] | lower == 'debian' and ansible_facts['distribution_major_version'] is version('14', '>=')) or
        (ansible_facts['distribution'] | lower == 'ubuntu' and ansible_facts['distribution_version'] is version('26.04', '>='))
    )
  }}

gnocchi_devel_distro_packages:
  - build-essential
  - git
  - libpq-dev
  - librados-dev
  - libsystemd-dev

gnocchi_service_distro_packages:
  - python3-gnocchi
  - python3-systemd

gnocchi_distro_packages:
  - "{{ _gnocchi_package_names_condition | ternary('libxml2-16', 'libxml2') }}"
